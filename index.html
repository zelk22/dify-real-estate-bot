<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתחם שלמה בן יוסף - עוזר דיגיטלי לדיירים</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* מסך נעילת סיסמה */
        #login-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }

        .login-card h2 {
            margin-bottom: 15px;
            color: var(--primary-color);
            font-size: 1.4rem;
        }

        .login-card p {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--secondary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #172554;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        /* אזור הבוט המוגן */
        #protected-content {
            display: none;
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 20px auto;
            padding: 0 20px;
        }

        .chat-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            height: 750px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #64748b;
            background-color: #f1f5f9;
            border-top: 1px solid #e2e8f0;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>מתחם שלמה בן יוסף</h1>
        <p>מערכת מידע דיגיטלית מאובטחת לתושבי המתחם</p>
    </header>

    <div id="login-screen">
        <div class="login-card">
            <h2>כניסת דיירים מאובטחת</h2>
            <p>אנא הזן את סיסמת המתחם כדי לגשת לעוזר הדיגיטלי ולמסמכי הפרויקט.</p>
            
            <form id="login-form" onsubmit="checkPassword(event)">
                <div class="input-group">
                    <input type="password" id="password-input" placeholder="הזן סיסמה כאן" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">התחבר למערכת</button>
                <div id="error-txt" class="error-message">סיסמה שגויה, אנא נסה שנית.</div>
            </form>
        </div>
    </div>

    <main id="protected-content">
        <div class="chat-container">
            <iframe
                src="https://udify.app/chatbot/6aGX0LTs1ViF9Gak"
                allow="microphone">
            </iframe>
        </div>
    </main>

    <footer>
        <p>© 2026 נציגות דיירים מתחם שלמה בן יוסף. המערכת מיועדת לשימוש פנימי בלבד.</p>
    </footer>

    <script>
        // הגדרת הסיסמה הרצויה (תוכל לשנות אותה לכל מה שתרצה בין הגרשיים)
        const CORRECT_PASSWORD = "1234"; 

        function checkPassword(event) {
            event.preventDefault(); // מונע מהטופס לרענן את העמוד סתם
            
            const userInput = document.getElementById("password-input").value;
            const errorText = document.getElementById("error-txt");
            const loginScreen = document.getElementById("login-screen");
            const protectedContent = document.getElementById("protected-content");

            if (userInput === CORRECT_PASSWORD) {
                // העלמת מסך הסיסמה והצגת הבוט
                loginScreen.style.display = "none";
                protectedContent.style.display = "block";
            } else {
                // הצגת שגיאה ואיפוס שדה הסיסמה
                errorText.style.display = "block";
                document.getElementById("password-input").value = "";
                document.getElementById("password-input").focus();
            }
        }
    </script>

</body>
</html>
